<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasileirão eFootball</title>
    <style>
        body { font-family: sans-serif; background: #05070a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #00ff88; text-transform: uppercase; margin-bottom: 5px; }
        
        /* TABELA DE JOGOS E CLASSIFICAÇÃO (Abaixo) */
        .secao-jogos { background: #111; border: 1px solid #333; padding: 20px; border-radius: 15px; margin-bottom: 50px; }
        
        /* HALL DA FAMA */
        .hall-fama { margin-top: 50px; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { 
            background: #111; border: 2px solid #f1c40f; padding: 20px; border-radius: 20px; 
            width: 160px; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 10px 25px rgba(241, 196, 15, 0.2); }
        
        .foto-container { position: relative; width: 100px; height: 100px; margin: auto; }
        .foto { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #f1c40f; object-fit: cover; }
        
        .nome { font-weight: bold; margin: 15px 0 10px; font-size: 1.1em; color: white; text-shadow: 2px 2px 4px #000; }
        .trofeu-icon { color: #f1c40f; font-size: 1.4em; letter-spacing: 3px; min-height: 1.6em; display: flex; align-items: center; justify-content: center; }
        .sem-trofeu { color: #444; font-size: 0.9em; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Brasileirão eFootball</h1>
    <p style="color: #888; margin-bottom: 30px;">Temporada Atual: Abril 2026</p>

    <div class="secao-jogos">
        <p>A classificação e a tabela de jogos aparecem aqui durante o torneio.</p>
        </div>

    <hr style="border: 1px solid #222; margin: 50px 0;">

    <div class="hall-fama">
        <h1 style="color: #f1c40f;">👑 HALL DA FAMA</h1>
        <p style="color: #888; font-size: 0.9em;">(Histórico de Campeões)</p>
        
        <div class="galeria" id="galeria"></div>
    </div>
</div>

<script>
    // ==========================================
    //  AQUI É ONDE VOCÊ EDITA OS TROFÉUS!
    //  Basta mudar o número e salvar no GitHub.
    // ==========================================
    const campeoes = [
        { nome: "Vitor90show", trofeus: 0, foto: "vitor90.jpg.jpeg" },
        { nome: "VitinhoRJ", trofeus: 0, foto: "vitinho.jpg.jpeg" },
        { nome: "SCARLLXD", trofeus: 0, foto: "scarllxd.jpg.jpeg" },
        { nome: "EoLuckyzinJr", trofeus: 0, foto: "luckzin.jpg.jpeg" }
    ];

    function carregarGaleria() {
        const div = document.getElementById('galeria');
        div.innerHTML = ""; // Limpa antes de carregar
        
        campeoes.forEach(c => {
            let icones = "🏆".repeat(c.trofeus);
            let classeTrofeu = "trofeu-icon";
            
            if(c.trofeus === 0) {
                icones = '<span class="sem-trofeu">Nenhum título</span>';
            }
            
            div.innerHTML += `
                <div class="card">
                    <div class="foto-container">
                        <img src="${c.foto}" class="foto" onerror="this.src='https://via.placeholder.com/100?text=?'; this.style.border='4px solid #444';">
                    </div>
                    <div class="nome">${c.nome}</div>
                    <div class="${classeTrofeu}">${icones}</div>
                </div>
            `;
        });
    }
    carregarGaleria();
</script>

</body>
</html>
