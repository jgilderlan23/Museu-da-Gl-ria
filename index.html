<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museu da Glória - Brasileirão eFootball</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            
            /* ========================================== */
            /* AQUI É ONDE ADICIONAMOS A GALÁXIA! */
            /* ========================================== */
            
            /* Passo 1: Defina uma cor escura de segurança (caso a imagem não carregue) */
            background-color: #05070a; 
            
            /* Passo 2: Coloque o caminho para a sua imagem de galáxia */
            background-image: url('fundo-galaxia.jpg.jpeg'); /* <-- O nome do arquivo deve ser este */
            
            /* Passo 3: Ajustes para cobrir a tela inteira */
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; /* O fundo fica fixo ao rolar (efeito premium) */
            background-repeat: no-repeat;
            
            color: white; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
        }

        .container { max-width: 950px; margin: auto; }

        h1 { 
            color: #00ff88; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            letter-spacing: 2px;
        }

        /* HALL DA FAMA */
        .hall-fama { margin-top: 50px; }
        .galeria { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 25px; 
            margin-top: 30px; 
        }

        /* CARDS ESTILO PREMIUM (GLASSMORPHISM) */
        .card { 
            /* Fundo semi-transparente para ver a galáxia */
            background: rgba(17, 17, 17, 0.6); 
            
            /* Efeito de desfoque no fundo (funciona nos navegadores modernos) */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); /* Para Safari */
            
            /* Borda dourada sutil */
            border: 1px solid rgba(241, 196, 15, 0.3); 
            
            padding: 25px; 
            border-radius: 20px; 
            width: 170px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        /* Efeito de brilho ao passar o mouse */
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.6s;
        }

        .card:hover::before { left: 150%; }

        .card:hover { 
            transform: translateY(-12px) scale(1.02); 
            border-color: #f1c40f;
            box-shadow: 0 15px 45px rgba(241, 196, 15, 0.25); 
        }

        /* FOTO CIRCULAR DOS JOGADORES */
        .foto-container { 
            position: relative; 
            width: 110px; 
            height: 110px; 
            margin: auto; 
        }
        
        .foto { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 3px solid #f1c40f; 
            object-fit: cover;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.3);
            background: rgba(34, 34, 34, 0.8);
        }

        .nome { 
            font-weight: 800; 
            margin: 15px 0 5px; 
            font-size: 1.1em; 
            color: #fff; 
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .trofeu-icon { 
            color: #f1c40f; 
            font-size: 1.5em; 
            filter: drop-shadow(0 0 5px rgba(241, 196, 15, 0.5));
            min-height: 1.6em; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .sem-trofeu { 
            color: #aaa; /* Cor mais clara para ler melhor na galáxia */
            font-size: 0.8em; 
            text-transform: lowercase;
            font-style: italic; 
        }

        hr { border: 0; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent); margin: 60px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Brasileirão eFootball</h1>
    <p style="color: #00ff88; font-weight: bold; opacity: 0.8; margin-bottom: 30px;">Temporada Atual: Abril 2026</p>

    <hr>

    <div class="hall-fama">
        <h1 style="color: #f1c40f; font-size: 2.5em; margin-bottom: 0;">👑 HALL DA FAMA</h1>
        <p style="color: #aaa; letter-spacing: 3px; font-size: 0.8em; margin-top: 5px; text-transform: uppercase;">(Histórico de Campeões)</p>
        
        <div class="galeria" id="galeria"></div>
    </div>
</div>

<script>
    // ==========================================
    // LISTA DE JOGADORES ATUALIZADA
    // ==========================================
    const campeoes = [
        { nome: "Vitor90show", trofeus: 1, foto: "vitor90.jpg.jpeg" },
        { nome: "VitinhoRJ", trofeus: 3, foto: "vitinho.jpg.jpeg" },
        { nome: "SCARLLXD", trofeus: 0, foto: "scarllxd.jpg.jpeg" },
        { nome: "EoLuckyzinJr", trofeus: 3, foto: "luckzin.jpg.jpeg" },
        { nome: "Bened", trofeus: 0, foto: "bened.jpg.jpeg" }
    ];

    function carregarGaleria() {
        const div = document.getElementById('galeria');
        div.innerHTML = ""; 
        
        campeoes.forEach(c => {
            let icones = "🏆".repeat(c.trofeus);
            
            if(c.trofeus === 0) {
                icones = '<span class="sem-trofeu">Nenhum título</span>';
            }
            
            div.innerHTML += `
                <div class="card">
                    <div class="foto-container">
                        <img src="${c.foto}" class="foto" onerror="this.src='https://via.placeholder.com/110/222/f1c40f?text=PLAYER';">
                    </div>
                    <div class="nome">${c.nome}</div>
                    <div class="trofeu-icon">${icones}</div>
                </div>
            `;
        });
    }
    carregarGaleria();
</script>

</body>
</html>
